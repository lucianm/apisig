name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Build (self-contained, Windows)
            os: windows-2022
            build_dir: out/ci-self-contained
            cmake_generator_args: -G "Visual Studio 17 2022"
            cmake_arch_args: -A x64
            cmake_configure_args: -D APISIG_SELF_CONTAINED=ON -D APISIG_WITH_LIBTOOLING=OFF
            run_tests: false

          - label: Build (LibTooling + official LLVM SDK, Windows)
            os: windows-2022
            build_dir: out/ci-libtooling
            cmake_generator_args: -G "Visual Studio 17 2022"
            cmake_arch_args: -A x64
            cmake_configure_args: -D APISIG_SELF_CONTAINED=OFF -D APISIG_WITH_LIBTOOLING=ON -D APISIG_DOWNLOAD_LLVM_SDK=ON
            run_tests: true

          - label: Build (self-contained, Ubuntu)
            os: ubuntu-24.04
            build_dir: out/ci-self-contained-ubuntu
            cmake_generator_args: ""
            cmake_arch_args: ""
            cmake_configure_args: -D APISIG_SELF_CONTAINED=ON -D APISIG_WITH_LIBTOOLING=OFF
            run_tests: false

          - label: Build (self-contained, macOS)
            os: macos-15
            build_dir: out/ci-self-contained-macos
            cmake_generator_args: ""
            cmake_arch_args: ""
            cmake_configure_args: -D APISIG_SELF_CONTAINED=ON -D APISIG_WITH_LIBTOOLING=OFF
            run_tests: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B ${{ matrix.build_dir }}
          ${{ matrix.cmake_generator_args }}
          ${{ matrix.cmake_arch_args }}
          ${{ matrix.cmake_configure_args }}

      - name: Build
        shell: pwsh
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      - name: Test
        if: ${{ matrix.run_tests }}
        shell: pwsh
        run: ctest --test-dir ${{ matrix.build_dir }} -C Release --output-on-failure

