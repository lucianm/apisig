name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      package_version:
        description: Version string to use in package names when running manually
        required: false
        default: ""
        type: string
      publish_release:
        description: Publish a GitHub release from this run
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-windows:
    name: Package (${{ matrix.label }})
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 self-contained
            build_dir: out/release-build-self-contained
            package_suffix: windows-x64-self-contained
            cmake_configure_args: -D APISIG_SELF_CONTAINED=ON -D APISIG_WITH_LIBTOOLING=OFF

          - label: Windows x64 LibTooling
            build_dir: out/release-build-libtooling
            package_suffix: windows-x64-libtooling
            cmake_configure_args: -D APISIG_SELF_CONTAINED=OFF -D APISIG_WITH_LIBTOOLING=ON -D APISIG_DOWNLOAD_LLVM_SDK=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B ${{ matrix.build_dir }}
          -G "Visual Studio 17 2022"
          -A x64
          ${{ matrix.cmake_configure_args }}

      - name: Build
        shell: pwsh
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      - name: Package archive
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "main") {
            $version = "${{ github.event.inputs.package_version }}"
          }

          if ([string]::IsNullOrWhiteSpace($version) -or $version -eq "" -or $version -eq "main") {
              $version = "${{ github.sha }}".Substring(0, 8)
          }

          $packageName = "apisig-$version-${{ matrix.package_suffix }}"
          $stagingRoot = Join-Path $PWD "out/package/$packageName"
          $distDir = Join-Path $PWD "out/dist"

          New-Item -ItemType Directory -Force -Path $stagingRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          Copy-Item "${{ matrix.build_dir }}/Release/apisig.exe" -Destination $stagingRoot -Force
          Copy-Item "README.md" -Destination $stagingRoot -Force
          Copy-Item "LICENSE" -Destination $stagingRoot -Force

          if (Test-Path "docs") {
              Copy-Item "docs" -Destination (Join-Path $stagingRoot "docs") -Recurse -Force
          }

          $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
          if ($sevenZip) {
              $archivePath = Join-Path $distDir ("$packageName.7z")
              & $sevenZip.Source a -t7z -mx=9 $archivePath "$stagingRoot\*"
              if ($LASTEXITCODE -ne 0) {
                  throw "7z packaging failed with exit code $LASTEXITCODE"
              }
          }
          else {
              $archivePath = Join-Path $distDir ("$packageName.zip")
              Compress-Archive -Path "$stagingRoot\*" -DestinationPath $archivePath -CompressionLevel Optimal -Force
          }

          "archive_path=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_name=$(Split-Path $archivePath -Leaf)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: ${{ steps.package.outputs.archive_path }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive_path }}
          generate_release_notes: true
